<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SoundDeck Studio</title>
  <script src="sdpi-components.js"></script>
  <link rel="stylesheet" href="inspector.css">
</head>
<body>
  <sdpi-item label="Slot">
    <sdpi-select setting="slot" default="" datasource="slots" loading="Loading slots…" hot-reload show-refresh></sdpi-select>
  </sdpi-item>
  <sdpi-item label="Board">
    <sdpi-select setting="boardId" default="" datasource="boards" loading="Loading boards…" hot-reload show-refresh></sdpi-select>
  </sdpi-item>
  <p id="status" role="status"></p>
  <script src="inspector.js"></script>
</body>
</html>
