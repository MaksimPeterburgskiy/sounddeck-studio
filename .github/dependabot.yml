version: 2
updates:
  # GitHub's Dependabot YAML value for pnpm is still "npm".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it (security updates bypass
    # this) so maintainers can review ecosystem reports before merging.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
