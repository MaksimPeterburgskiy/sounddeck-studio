name: Bug report
description: Something isn't working correctly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Devices tab
        2. Enable mic passthrough
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 0.1.2 (shown in the installer / release you downloaded)
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: audio-setup
    attributes:
      label: Audio setup (if relevant)
      description: Output device, microphone, whether VB-CABLE is installed, Discord/OBS/etc. in use.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Anything from the console, or screenshots of the problem.
