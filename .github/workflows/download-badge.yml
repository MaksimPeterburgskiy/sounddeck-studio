name: Download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Update badge data
        run: node scripts/update-download-badge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads-badge.json
          if git diff --cached --quiet; then
            echo "Download badge is already up to date."
          else
            git commit -m "Update download badge"
            git push
          fi
