name: Download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"
  release:
    types: [published, edited, deleted]

permissions:
  contents: read

concurrency:
  group: download-badge

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update badge data
        run: node scripts/update-download-badge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The PAT appears only here, never in an action's inputs or the script
      # env, and pushes directly to main through the admin bypass on the
      # protect-main ruleset (the workflow token cannot bypass it, and pull
      # requests it opens never run the required checks).
      - name: Commit badge data
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads-badge.json
          if git diff --cached --quiet; then
            echo "Download badge is already up to date."
          else
            gh auth setup-git
            git commit -m "Update download badge"
            git push origin HEAD:main
          fi
