name: Download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"
  release:
    types: [published, edited, deleted]

permissions:
  contents: read

concurrency:
  group: download-badge

jobs:
  calculate:
    runs-on: ubuntu-latest
    outputs:
      badge_data: ${{ steps.export.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Update badge data
        run: node scripts/update-download-badge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Export badge data
        run: echo "data=$(base64 < docs/downloads-badge.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
        id: export

  write:
    needs: calculate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job holds the write token, so it runs no action steps; the badge
      # commit goes straight to main through the Contents API. A branch rule
      # that requires pull requests on main needs a bypass for github-actions
      # or this data-only refresh stops working.
      - name: Commit badge data to main
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_DATA: ${{ needs.calculate.outputs.badge_data }}
        run: |
          current="$(gh api "repos/${{ github.repository }}/contents/docs/downloads-badge.json?ref=main")"
          if [[ "$(jq -r '.content' <<<"$current" | tr -d '\n')" == "$BADGE_DATA" ]]; then
            echo "Download badge is already up to date."
            exit 0
          fi
          gh api --method PUT "repos/${{ github.repository }}/contents/docs/downloads-badge.json" \
            --raw-field message="Update download badge" \
            --raw-field content="$BADGE_DATA" \
            --raw-field sha="$(jq -r '.sha' <<<"$current")" \
            --raw-field branch=main \
            >/dev/null
          echo "Committed the refreshed download badge to main."
