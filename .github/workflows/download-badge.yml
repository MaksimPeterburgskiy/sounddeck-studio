name: Download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"
  release:
    types: [published, edited, deleted]

permissions:
  contents: read

concurrency:
  group: download-badge

jobs:
  calculate:
    runs-on: ubuntu-latest
    outputs:
      badge_data: ${{ steps.export.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Update badge data
        run: node scripts/update-download-badge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Export badge data
        run: echo "data=$(base64 < docs/downloads-badge.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
        id: export

  write:
    needs: calculate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open or update badge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_DATA: ${{ needs.calculate.outputs.badge_data }}
          BADGE_BRANCH: automation/update-download-badge
        run: |
          current_data="$(gh api "repos/${{ github.repository }}/contents/docs/downloads-badge.json?ref=main" --jq '.content' | tr -d '\n')"
          existing_pr_number="$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$BADGE_BRANCH&base=main" --jq '.[0].number // empty')"
          if [[ "$current_data" == "$BADGE_DATA" ]]; then
            if [[ -n "$existing_pr_number" ]]; then
              gh api --method PATCH "repos/${{ github.repository }}/pulls/$existing_pr_number" \
                --raw-field state=closed \
                >/dev/null
              echo "Closed stale badge pull request #$existing_pr_number."
            fi
            echo "Download badge is already up to date."
            exit 0
          fi

          base_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/${{ github.repository }}/git/ref/heads/$BADGE_BRANCH" >/dev/null 2>&1; then
            if [[ -z "$existing_pr_number" ]]; then
              gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/$BADGE_BRANCH" \
                --raw-field sha="$base_sha" \
                --field force=true \
                >/dev/null
            fi
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              --raw-field ref="refs/heads/$BADGE_BRANCH" \
              --raw-field sha="$base_sha" \
              >/dev/null
          fi

          current_sha="$(gh api "repos/${{ github.repository }}/contents/docs/downloads-badge.json?ref=$BADGE_BRANCH" --jq '.sha')"
          gh api --method PUT "repos/${{ github.repository }}/contents/docs/downloads-badge.json" \
            --raw-field message="Update download badge" \
            --raw-field content="$BADGE_DATA" \
            --raw-field sha="$current_sha" \
            --raw-field branch="$BADGE_BRANCH" \
            >/dev/null

          if [[ -n "$existing_pr_number" ]]; then
            echo "Updated https://github.com/${{ github.repository }}/pull/$existing_pr_number"
          else
            gh api --method POST "repos/${{ github.repository }}/pulls" \
              --raw-field title="Update download badge" \
              --raw-field head="$BADGE_BRANCH" \
              --raw-field base="main" \
              --raw-field body="Automated download-count refresh. Merge after the required review and build-and-test check pass." \
              --jq '.html_url'
          fi
