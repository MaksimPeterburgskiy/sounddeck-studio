name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_RELEASE_TOKEN: ""
          RELEASE_TOKEN: ""

      - name: Validate release security policy
        run: pnpm run validate:security

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  release-build:
    # Pinned so the check context stays stable if the matrix gains keys later.
    name: release-build (${{ matrix.runner }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_RELEASE_TOKEN: ""
          RELEASE_TOKEN: ""

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_RELEASE_TOKEN: ""
          RELEASE_TOKEN: ""

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        run: pnpm run dist:win:no-publish

      - name: Build unsigned macOS release artifact
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_RELEASE_TOKEN: ""
          RELEASE_TOKEN: ""
        run: pnpm run dist:mac:unsigned
