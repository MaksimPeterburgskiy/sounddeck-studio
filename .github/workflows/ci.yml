name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  release-build:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            command: pnpm run dist:win -- --publish never
          - runner: macos-latest
            command: pnpm run dist:mac:unsigned
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"

      - name: Build release artifacts
        run: ${{ matrix.command }}
