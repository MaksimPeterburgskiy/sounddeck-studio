name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  windows-installer-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and verify reviewed VB-CABLE payload
        run: node scripts/fetch-vbcable.mjs

      - name: Generate installer artwork
        run: node scripts/make-installer-art.mjs

      - name: Build renderer
        run: pnpm run build

      - name: Reverify VB-CABLE packaging input
        run: node scripts/verify-vbcable.mjs

      - name: Compile Windows NSIS installer without publishing or running it
        run: pnpm exec electron-builder --win nsis --publish never
