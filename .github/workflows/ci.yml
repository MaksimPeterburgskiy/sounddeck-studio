name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  release-build:
    # Pinned so the check context stays stable if the matrix gains keys later.
    name: release-build (${{ matrix.runner }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        run: pnpm run dist:win:no-publish

      - name: Build unsigned macOS release artifact
        if: runner.os == 'macOS'
        # scripts/fetch-ytdlp-mac.mjs queries the GitHub releases API, which is
        # capped at 60 requests/hour per IP without a token.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run dist:mac:unsigned
