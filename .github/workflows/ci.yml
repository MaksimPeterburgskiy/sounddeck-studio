name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release security policy
        run: pnpm run validate:security

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  release-build:
    # Pinned so the check context stays stable if the matrix gains keys later.
    name: release-build (${{ matrix.runner }})
    # PRs only: pushes to main get full-packaging coverage from the nightly
    # beta build, so rebuilding (and discarding) artifacts here is wasted work.
    if: github.event_name == 'pull_request'
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        run: pnpm run dist:win

      # Reuses the verified payload the build above already fetched into
      # build/vbcable. Confirms the installer-time verifier rejects a hostile
      # PowerShell module, an unapproved execution target, a tampered manifest,
      # an unlisted companion file, and a tampered payload file.
      - name: Exercise VB-CABLE runtime verifier against hostile inputs
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-vbcable-runtime-verifier.ps1 -PayloadDirectory .\build\vbcable

      - name: Build unsigned macOS release artifact
        if: runner.os == 'macOS'
        run: pnpm run dist:mac:unsigned
