name: Release

# Cuts a stable release from main. The release stays a draft while both
# platforms build, upload, and validate their assets, then flips to published
# in one atomic step so no updater ever sees a partial release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency: release

permissions:
  contents: read

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release security policy
        run: pnpm run validate:security

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ inputs.bump }} -m "Release v%s"
          $version = node -p "require('./package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      # A run that dies after packaging leaves a draft whose version this run
      # has already bumped past, so it can never be published. Runs before the
      # new tag exists, so this can only ever match earlier drafts. The git tag
      # and version commit stay: they are already on main and prod.
      - name: Delete draft releases left by failed runs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" `
            --jq '.[] | select(.draft and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .id' |
            ForEach-Object {
              Write-Host "Deleting stale draft release $_"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$_"
            }

      - name: Push version, fast-forward prod, and create draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          git push origin main --follow-tags
          git fetch origin prod
          git checkout prod
          git merge --ff-only main
          git push origin prod
          git checkout main
          gh release create "v${{ steps.version.outputs.version }}" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --draft `
            --title "SoundDeck Studio v${{ steps.version.outputs.version }}"

  windows-package:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist:win fetches the manifest-pinned native tools, builds without
      # publishing, and verifies the packaged binaries. Same pipeline as CI.
      - name: Build and verify Windows installers
        run: pnpm run dist:win

      - name: Upload Windows artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $patterns = @("release/*.exe", "release/*.exe.blockmap", "release/latest.yml")
          $artifactPaths = @($patterns | ForEach-Object {
            Get-ChildItem $_ -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          })
          if (-not ($artifactPaths | Where-Object { $_ -like "*.exe" })) {
            throw "No Windows executable artifacts found."
          }
          if (-not ($artifactPaths | Where-Object { $_ -like "*latest.yml" })) {
            throw "No Windows updater feed found."
          }
          gh release upload "${{ needs.version.outputs.tag }}" @artifactPaths --clobber

  macos-package:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified native tools
        run: node scripts/fetch-native-tools.mjs --platform darwin --arch universal

      - name: Import Developer ID certificates
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build signed and notarized macOS package
        run: pnpm run dist:mac
        env:
          SOUNDDECK_NATIVE_TOOLS_OFFLINE: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          BLACKHOLE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CSC_NAME }}
          CSC_INSTALLER_NAME: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          BLACKHOLE_REPO: https://github.com/ExistentialAudio/BlackHole.git
          BLACKHOLE_COMMIT: 11efc147fef0ac537be1c24ea7e29e4b2a2d63c7

      - name: Verify macOS package
        run: |
          pkgutil --check-signature release/*.pkg
          node scripts/verify-mac-pkg.mjs release/*.pkg
          spctl --assess --verbose --type install release/*.pkg
          xcrun stapler validate release/*.pkg

      - name: Upload macOS artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # macOS runners default to bash 3.2, which lacks mapfile.
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(node scripts/prepare-mac-release-assets.mjs --channel latest)
          gh release upload "${{ needs.version.outputs.tag }}" "${assets[@]}" --clobber

  release-notes:
    needs: [version, windows-package, macos-package]
    runs-on: windows-latest
    # contents: write lets github.token read the draft release's assets when
    # composing the notes — drafts are invisible to read-only tokens. The
    # write to the release itself still happens through the PAT.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ needs.version.outputs.version }}"
          $tag = "${{ needs.version.outputs.tag }}"
          # Prerelease tags (betas, rc, ...) land on main too; notes must diff
          # against the previous *stable*, so skip every dashed tag.
          $prev = git describe --tags --abbrev=0 --exclude "*-*" "$tag^" 2>$null
          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $windowsInstaller = $assetNames | Where-Object { $_ -eq "SoundDeck-Studio-Setup-$version.exe" } | Select-Object -First 1
          $windowsPortable = $assetNames | Where-Object { $_ -eq "SoundDeck-Studio-$version.exe" } | Select-Object -First 1
          $macInstaller = $assetNames | Where-Object { $_ -like "SoundDeck*.pkg" } | Select-Object -First 1

          if (-not $windowsInstaller) { throw "Could not find Windows installer asset for $tag." }
          if (-not $windowsPortable) { throw "Could not find Windows portable asset for $tag." }
          if (-not $macInstaller) { throw "Could not find macOS pkg asset for $tag." }

          function AssetUrl($assetName) {
            $encoded = [System.Uri]::EscapeDataString($assetName)
            "https://github.com/$repo/releases/download/$tag/$encoded"
          }

          $lines = @(
            "## SoundDeck Studio $version",
            "",
            "### Downloads",
            "",
            "| File | Notes |",
            "| --- | --- |",
            "| [$windowsInstaller]($(AssetUrl $windowsInstaller)) | **Recommended for Windows.** Installer with auto-update; sets up the VB-CABLE virtual mic if needed. |",
            "| [$macInstaller]($(AssetUrl $macInstaller)) | **Recommended for macOS.** Signed and notarized package with auto-update; installs SoundDeck Studio and the bundled BlackHole 2ch virtual audio driver. |",
            "| [$windowsPortable]($(AssetUrl $windowsPortable)) | Windows portable. No installation, but no auto-update either. |",
            "",
            "> macOS auto-update metadata and zip artifacts are attached to the release for the app updater.",
            "",
            "> On macOS, microphone passthrough, recording, and global hotkeys may require approving SoundDeck Studio in System Settings -> Privacy & Security.",
            "",
            "> Windows builds are unsigned, so SmartScreen may warn on first run: *More info -> Run anyway*.",
            ""
          )

          if ($prev) {
            $commits = git log "$prev..$tag" --no-merges --pretty='- %s (%h)' | Where-Object { $_ -notmatch '^- Release v\d' }
            $lines += "### What's changed since $prev"
            $lines += ""
            $lines += $commits
            $lines += ""
            $lines += "**Full changelog**: [$prev...$tag](https://github.com/$repo/compare/$prev...$tag)"
          } else {
            $lines += "First public release."
          }

          Set-Content -Path notes.md -Value ($lines -join "`n") -Encoding utf8

      - name: Attach notes to draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "${{ github.repository }}" --title "SoundDeck Studio ${{ needs.version.outputs.tag }}" --notes-file notes.md

  publish:
    needs: [version, windows-package, macos-package, release-notes]
    runs-on: ubuntu-latest
    steps:
      # Publishing through the PAT rather than github.token: a release event
      # raised by GITHUB_TOKEN triggers no workflows, and download-badge.yml
      # listens for release:published.
      - name: Validate draft assets and publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Drafts have no git ref, so releases/tags/$TAG can't find them.
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n1)"
          if [[ -z "$release_id" ]]; then
            echo "Draft release for $TAG not found."
            exit 1
          fi

          assets_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          names="$(jq -r '.[].name' <<< "$assets_json")"
          echo "Draft assets:"
          echo "$names"

          missing=0
          require_asset() {
            if ! grep -Fxq "$1" <<< "$names"; then
              echo "Missing required asset: $1"
              missing=1
            fi
          }
          require_asset "SoundDeck-Studio-Setup-$VERSION.exe"
          require_asset "SoundDeck-Studio-Setup-$VERSION.exe.blockmap"
          require_asset "SoundDeck-Studio-$VERSION.exe"
          require_asset "latest.yml"
          require_asset "SoundDeck.Studio-$VERSION.pkg"
          require_asset "SoundDeck.Studio-$VERSION.zip"
          require_asset "latest-mac.yml"
          if ! grep -Fxq "SoundDeck.Studio-$VERSION.zip.blockmap" <<< "$names"; then
            echo "Note: no macOS zip blockmap; differential mac updates unavailable for this release."
          fi

          # The updater feeds must point at assets that actually exist.
          check_feed_refs() {
            local feed="$1"
            local asset_id
            asset_id="$(jq -r ".[] | select(.name == \"$feed\") | .id" <<< "$assets_json" | head -n1)"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H "Accept: application/octet-stream" > "$feed"
            while read -r ref; do
              [[ -z "$ref" ]] && continue
              if ! grep -Fxq "$ref" <<< "$names"; then
                echo "$feed references missing asset: $ref"
                missing=1
              fi
            done < <(sed -nE 's/^.*(url|path): (.+)$/\2/p' "$feed" | sort -u)
          }
          check_feed_refs latest.yml
          check_feed_refs latest-mac.yml

          if [[ "$missing" -ne 0 ]]; then
            echo "Draft release is incomplete; leaving it unpublished."
            exit 1
          fi

          # The atomic step: both platforms are complete and cross-checked, so
          # the release becomes visible to users and updaters in one edit.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG — https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
