name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency: release

permissions:
  contents: write

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0
          # PAT so version/tag pushes pass branch protection (GITHUB_TOKEN can't).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ inputs.bump }} -m "Release v%s"
          $version = node -p "require('./package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Push version commit and tag to main
        run: git push origin main --follow-tags

      - name: Fast-forward prod to main
        run: |
          git fetch origin prod
          git checkout prod
          git merge --ff-only main
          git push origin prod
          git checkout main

  windows-package:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch VB-CABLE driver pack
        run: node scripts/fetch-vbcable.mjs

      - name: Generate installer artwork
        run: node scripts/make-installer-art.mjs

      - name: Build renderer
        run: pnpm run build

      - name: Reverify VB-CABLE packaging input
        run: node scripts/verify-vbcable.mjs

      - name: Build and publish Windows installers
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  macos-package:
    needs: [version, windows-package]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Import Developer ID certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"

      - name: Build signed and notarized macOS package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          BLACKHOLE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CSC_NAME }}
          CSC_INSTALLER_NAME: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          BLACKHOLE_REPO: https://github.com/ExistentialAudio/BlackHole.git
          BLACKHOLE_COMMIT: 11efc147fef0ac537be1c24ea7e29e4b2a2d63c7
        run: pnpm run dist:mac

      - name: Verify macOS package
        run: |
          pkgutil --check-signature release/*.pkg
          node scripts/verify-mac-pkg.mjs release/*.pkg
          spctl --assess --verbose --type install release/*.pkg
          xcrun stapler validate release/*.pkg

      - name: Upload macOS package and update artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          pkg_artifacts=(release/*.pkg)
          zip_artifacts=(release/*.zip)
          blockmap_artifacts=(release/*.zip.blockmap)

          if (( ${#pkg_artifacts[@]} == 0 )); then
            echo "No macOS pkg artifact found in release/."
            exit 1
          fi
          if (( ${#zip_artifacts[@]} == 0 )); then
            echo "No macOS zip updater artifact found in release/."
            exit 1
          fi
          if [[ ! -f release/latest-mac.yml ]]; then
            echo "No latest-mac.yml updater feed found in release/."
            exit 1
          fi

          sanitize_artifact_names() {
            local artifact
            local base
            local dir
            local sanitized

            for artifact in "$@"; do
              base="$(basename "$artifact")"
              dir="$(dirname "$artifact")"
              sanitized="${base// /.}"
              if [[ "$base" != "$sanitized" ]]; then
                mv "$artifact" "$dir/$sanitized"
              fi
            done
          }

          sanitize_artifact_names "${pkg_artifacts[@]}" "${zip_artifacts[@]}" "${blockmap_artifacts[@]}"

          pkg_artifacts=(release/*.pkg)
          zip_artifacts=(release/*.zip)
          blockmap_artifacts=(release/*.zip.blockmap)

          mac_zip_name="$(basename "${zip_artifacts[0]}")"
          node -e 'const fs = require("fs"); const file = "release/latest-mac.yml"; const zip = process.argv[1]; const feed = fs.readFileSync(file, "utf8").replace(/url: .+\.zip/g, `url: ${zip}`).replace(/path: .+\.zip/g, `path: ${zip}`); fs.writeFileSync(file, feed);' "$mac_zip_name"

          gh release upload "${{ needs.version.outputs.tag }}" \
            "${pkg_artifacts[@]}" \
            "${zip_artifacts[@]}" \
            "${blockmap_artifacts[@]}" \
            release/latest-mac.yml \
            --clobber

  release-notes:
    needs: [version, windows-package, macos-package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ needs.version.outputs.version }}"
          $tag = "${{ needs.version.outputs.tag }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $windowsInstaller = $assetNames | Where-Object { $_ -eq "SoundDeck-Studio-Setup-$version.exe" } | Select-Object -First 1
          $windowsPortable = $assetNames | Where-Object { $_ -eq "SoundDeck-Studio-$version.exe" } | Select-Object -First 1
          $macInstaller = $assetNames | Where-Object { $_ -like "SoundDeck*.pkg" } | Select-Object -First 1

          if (-not $windowsInstaller) { throw "Could not find Windows installer asset for $tag." }
          if (-not $windowsPortable) { throw "Could not find Windows portable asset for $tag." }
          if (-not $macInstaller) { throw "Could not find macOS pkg asset for $tag." }

          function AssetUrl($assetName) {
            $encoded = [System.Uri]::EscapeDataString($assetName)
            "https://github.com/$repo/releases/download/$tag/$encoded"
          }

          $lines = @(
            "## SoundDeck Studio $version",
            "",
            "### Downloads",
            "",
            "| File | Notes |",
            "| --- | --- |",
            "| [$windowsInstaller]($(AssetUrl $windowsInstaller)) | **Recommended for Windows.** Installer with auto-update; sets up the VB-CABLE virtual mic if needed. |",
            "| [$macInstaller]($(AssetUrl $macInstaller)) | **Recommended for macOS.** Signed and notarized package with auto-update; installs SoundDeck Studio and the bundled BlackHole 2ch virtual audio driver. |",
            "| [$windowsPortable]($(AssetUrl $windowsPortable)) | Windows portable. No installation, but no auto-update either. |",
            "",
            "> macOS auto-update metadata and zip artifacts are attached to the release for the app updater.",
            "",
            "> On macOS, microphone passthrough, recording, and global hotkeys may require approving SoundDeck Studio in System Settings -> Privacy & Security.",
            "",
            "> Windows builds are unsigned, so SmartScreen may warn on first run: *More info -> Run anyway*.",
            ""
          )

          if ($prev) {
            $commits = git log "$prev..$tag" --no-merges --pretty='- %s (%h)' | Where-Object { $_ -notmatch '^- Release v\d' }
            $lines += "### What's changed since $prev"
            $lines += ""
            $lines += $commits
            $lines += ""
            $lines += "**Full changelog**: [$prev...$tag](https://github.com/$repo/compare/$prev...$tag)"
          } else {
            $lines += "First public release."
          }

          Set-Content -Path notes.md -Value ($lines -join "`n") -Encoding utf8
          gh release edit $tag --repo $repo --title "SoundDeck Studio $tag" --notes-file notes.md

      - name: Summary
        run: echo "Released v${{ needs.version.outputs.version }} — https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> $env:GITHUB_STEP_SUMMARY
