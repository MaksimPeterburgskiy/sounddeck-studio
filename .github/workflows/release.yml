name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # PAT so version/tag pushes pass branch protection (GITHUB_TOKEN can't).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build renderer
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ inputs.bump }} -m "Release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Push version commit and tag to main
        run: git push origin main --follow-tags

      - name: Fast-forward prod to main
        run: |
          git fetch origin prod
          git checkout prod
          git merge --ff-only main
          git push origin prod
          git checkout main

      - name: Fetch VB-CABLE driver pack
        run: node scripts/fetch-vbcable.mjs

      - name: Generate installer artwork
        run: node scripts/make-installer-art.mjs

      - name: Build and publish Windows installers
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null

          $lines = @(
            "## SoundDeck Studio $version",
            "",
            "### Downloads",
            "",
            "| File | Notes |",
            "| --- | --- |",
            "| [SoundDeck-Studio-Setup-$version.exe](https://github.com/$repo/releases/download/$tag/SoundDeck-Studio-Setup-$version.exe) | **Recommended.** Installer with auto-update; sets up the VB-CABLE virtual mic if needed. |",
            "| [SoundDeck-Studio-$version.exe](https://github.com/$repo/releases/download/$tag/SoundDeck-Studio-$version.exe) | Portable. No installation, but no auto-update either. |",
            "",
            "> Builds are unsigned, so Windows SmartScreen may warn on first run: *More info -> Run anyway*.",
            ""
          )

          if ($prev) {
            $commits = git log "$prev..$tag" --no-merges --pretty='- %s (%h)' | Where-Object { $_ -notmatch '^- Release v\d' }
            $lines += "### What's changed since $prev"
            $lines += ""
            $lines += $commits
            $lines += ""
            $lines += "**Full changelog**: [$prev...$tag](https://github.com/$repo/compare/$prev...$tag)"
          } else {
            $lines += "First public release."
          }

          Set-Content -Path notes.md -Value ($lines -join "`n") -Encoding utf8
          gh release edit $tag --repo $repo --title "SoundDeck Studio $tag" --notes-file notes.md

      - name: Summary
        run: echo "Released v${{ steps.version.outputs.version }} — https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
