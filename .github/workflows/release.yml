name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # PAT so version/tag pushes pass branch protection (GITHUB_TOKEN can't).
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build renderer
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "Release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Push version commit and tag to main
        run: git push origin main --follow-tags

      - name: Fast-forward prod to main
        run: |
          git fetch origin prod
          git checkout prod
          git merge --ff-only main
          git push origin prod
          git checkout main

      - name: Fetch VB-CABLE driver pack
        run: node scripts/fetch-vbcable.mjs

      - name: Build and publish Windows installers
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Summary
        run: echo "Released v${{ steps.version.outputs.version }} — https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
