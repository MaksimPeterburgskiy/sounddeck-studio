name: Beta

# Publishes a beta prerelease from main: nightly when main has moved, or on
# demand via dispatch. The release stays a draft until both platforms have
# uploaded and validated every asset, then flips to a published prerelease in
# one atomic step so no updater ever sees a partial release.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# Queue overlapping runs instead of cancelling: killing a near-finished
# notarization is worse than waiting. queue is valid concurrency syntax since
# May 2026 (max lets up to 100 runs wait FIFO in the group):
# https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  version:
    # Betas only ever come from main: a dispatch on another ref would package
    # unmerged code under release notes that claim main. Skipping here skips
    # every downstream job too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Checked out by branch name, not github.sha: this run may have queued
      # behind a Release run in the shared concurrency group, and github.sha
      # was pinned before Release pushed its version commit and stable tag.
      # Resolving main here (and threading the SHA to the packaging jobs) makes
      # a queued beta build the post-release state instead of a stale one.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Compute beta version and create draft release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"

          # Freshness guard (cron only): skip the nightly when nothing real has
          # merged since the last build of any kind (stable or beta). Bot-only
          # commits don't count. Dispatched runs always build.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            last_tag="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
            if [[ -n "$last_tag" ]]; then
              new_commits="$(git log "$last_tag..HEAD" --no-merges --pretty='%s' | grep -vE '^(Release v|Update download badge)' || true)"
              if [[ -z "$new_commits" ]]; then
                echo "No new commits since $last_tag; skipping tonight's beta."
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          # Betas are prereleases of the *next* patch so they sort above the
          # current stable release. The commit counter is based on the latest
          # stable tag, so it resets at each real release. Excluding every
          # dashed tag skips all prereleases (beta, rc, ...), whose suffix
          # would otherwise break the patch arithmetic below.
          stable_tag="$(git describe --tags --abbrev=0 --match "v*" --exclude "*-*")"
          base="${stable_tag#v}"
          IFS=. read -r major minor patch <<< "$base"
          counter="$(git rev-list --count "$stable_tag..HEAD")"
          version="$major.$minor.$((patch + 1))-beta.$counter"
          tag="v$version"
          echo "Building $version from $stable_tag + $counter commits."

          # Idempotency: drop beta drafts left by failed runs (drafts never
          # create git tags, so deleting the release is enough).
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | test("-beta\\."))) | .id' |
          while read -r release_id; do
            echo "Deleting stale beta draft release $release_id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done

          # Same commit, same version: this exact build is already published.
          # Deleting it up front would leave no beta at all if the rebuild
          # failed mid-way, so keep the known-good release and skip. Delete
          # the release manually to force a rebuild of the same commit.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Beta $tag is already published for this commit; skipping rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_tag="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          {
            echo "> **Beta build**, published automatically from \`main\`. Expect rough edges. Betas auto-update to newer betas and move back onto the next stable release."
            echo
            if [[ -n "$prev_tag" ]]; then
              echo "### Changes since $prev_tag"
              echo
              git log "$prev_tag..HEAD" --no-merges --pretty='- %s (%h)' | grep -vE '^- (Release v|Update download badge)' || true
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev_tag...$tag"
            fi
          } > notes.md

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --target "$sha" \
            --title "SoundDeck Studio $version (beta)" \
            --notes-file notes.md

          {
            echo "should_build=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  windows-package:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Written in-tree only for this build; main never carries a beta version.
      - name: Set beta version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Fetch VB-CABLE driver pack
        run: node scripts/fetch-vbcable.mjs

      - name: Generate installer artwork
        run: node scripts/make-installer-art.mjs

      - name: Build renderer
        run: pnpm run build

      # EP_DRAFT makes electron-builder upload into the existing draft release
      # instead of publishing one of its own.
      - name: Build and upload Windows installers to the draft release
        run: pnpm exec electron-builder --win --publish always --config.publish.channel=beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "true"

  macos-package:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Import Developer ID certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"

      # Written in-tree only for this build; main never carries a beta version.
      - name: Set beta version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build signed and notarized macOS package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          BLACKHOLE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CSC_NAME }}
          CSC_INSTALLER_NAME: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          BLACKHOLE_REPO: https://github.com/ExistentialAudio/BlackHole.git
          BLACKHOLE_COMMIT: 11efc147fef0ac537be1c24ea7e29e4b2a2d63c7
        run: pnpm run dist:mac -- --channel beta

      - name: Verify macOS package
        run: |
          pkgutil --check-signature release/*.pkg
          node scripts/verify-mac-pkg.mjs release/*.pkg
          spctl --assess --verbose --type install release/*.pkg
          xcrun stapler validate release/*.pkg

      - name: Upload macOS package and update artifacts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # macOS runners default to bash 3.2, which lacks mapfile.
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(node scripts/prepare-mac-release-assets.mjs --channel beta)
          gh release upload "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber

  publish:
    needs: [version, windows-package, macos-package]
    runs-on: ubuntu-latest
    steps:
      - name: Validate draft assets and publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n1)"
          if [[ -z "$release_id" ]]; then
            echo "Draft release for $TAG not found."
            exit 1
          fi

          assets_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          names="$(jq -r '.[].name' <<< "$assets_json")"
          echo "Draft assets:"
          echo "$names"

          missing=0
          require_asset() {
            if ! grep -Fxq "$1" <<< "$names"; then
              echo "Missing required asset: $1"
              missing=1
            fi
          }
          require_asset "SoundDeck-Studio-Setup-$VERSION.exe"
          require_asset "SoundDeck-Studio-Setup-$VERSION.exe.blockmap"
          require_asset "SoundDeck-Studio-$VERSION.exe"
          require_asset "beta.yml"
          require_asset "SoundDeck.Studio-$VERSION.pkg"
          require_asset "SoundDeck.Studio-$VERSION.zip"
          require_asset "beta-mac.yml"
          if ! grep -Fxq "SoundDeck.Studio-$VERSION.zip.blockmap" <<< "$names"; then
            echo "Note: no macOS zip blockmap; differential mac updates unavailable for this beta."
          fi

          # The updater feeds must point at assets that actually exist.
          check_feed_refs() {
            local feed="$1"
            local asset_id
            asset_id="$(jq -r ".[] | select(.name == \"$feed\") | .id" <<< "$assets_json" | head -n1)"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H "Accept: application/octet-stream" > "$feed"
            while read -r ref; do
              [[ -z "$ref" ]] && continue
              if ! grep -Fxq "$ref" <<< "$names"; then
                echo "$feed references missing asset: $ref"
                missing=1
              fi
            done < <(sed -nE 's/^.*(url|path): (.+)$/\2/p' "$feed" | sort -u)
          }
          check_feed_refs beta.yml
          check_feed_refs beta-mac.yml

          if [[ "$missing" -ne 0 ]]; then
            echo "Draft release is incomplete; leaving it unpublished."
            exit 1
          fi

          # The atomic step: publishing creates the git tag at the pinned
          # target SHA and makes the beta visible to updaters.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          echo "Published beta $TAG — https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old betas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the newest 5 published betas. Only tags this workflow minted
          # (v*-beta.*) are candidates: stable releases and any hand-published
          # prerelease (rc, alpha, ...) are never touched.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("-beta\\."))) | [.created_at, .tag_name] | @tsv' |
            sort -r | tail -n +6 | cut -f2 |
          while read -r old_tag; do
            echo "Pruning old beta release $old_tag"
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
